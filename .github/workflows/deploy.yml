name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      push-fe-ref:
        description: "push-fe branch, tag, or SHA. Empty uses develop."
        required: false
        default: ""
        type: string

permissions:
  contents: read

# One deploy at a time. Do not cancel a deploy that is already uploading.
concurrency:
  group: deploy-push-fo-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve push-fe ref
        id: fe
        env:
          INPUT_REF: ${{ inputs.push-fe-ref }}
        run: |
          set -euo pipefail
          ref=$(printf '%s' "${INPUT_REF:-}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          if [ -z "$ref" ]; then
            ref=develop
          fi
          if [ "${#ref}" -gt 200 ]; then
            printf 'push-fe-ref is too long\n' >&2
            exit 1
          fi
          case "$ref" in
            *[!A-Za-z0-9._/-]*|-*|*/-*|*..*|*/|*/*/)
              printf 'invalid push-fe-ref\n' >&2
              exit 1
              ;;
          esac
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'push-fe ref: %s\n' "$ref"

      - name: Checkout push-fe
        uses: actions/checkout@v4
        with:
          repository: push-dot/push-fe
          ref: ${{ steps.fe.outputs.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: false
          fetch-depth: 1
          persist-credentials: true

      - name: Initialize fo-mobile and clear fo-web
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          if ! git config -f .gitmodules --get submodule.apps/fo-mobile.url >/dev/null 2>&1; then
            printf 'This push-fe ref has no apps/fo-mobile submodule. Use develop (9911f12 or later).\n' >&2
            exit 1
          fi
          git submodule update --init --depth 1 apps/fo-mobile
          test "$(git -C apps/fo-mobile rev-parse HEAD)" = "$(git rev-parse HEAD:apps/fo-mobile)"
          test -f pnpm-lock.yaml
          test -f pnpm-workspace.yaml
          rm -rf apps/fo-web

      - name: Checkout the commit to deploy
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: apps/fo-web
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
          persist-credentials: false

      - name: Record commits
        env:
          APP_SHA: ${{ github.sha }}
          FE_REF: ${{ steps.fe.outputs.ref }}
        run: |
          set -euo pipefail
          printf 'push-fe ref: %s\n' "$FE_REF"
          printf 'push-fe sha: %s\n' "$(git rev-parse HEAD)"
          printf 'app sha: %s\n' "$(git -C apps/fo-web rev-parse HEAD)"
          test "$(git -C apps/fo-web rev-parse HEAD)" = "$APP_SHA"
          test -f apps/fo-web/package.json
          test -f apps/fo-web/wrangler.jsonc
          test -f apps/fo-mobile/package.json

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lockfile hint
        if: failure() && steps.install.outcome == 'failure'
        run: |
          cat <<'HINT'
          pnpm install --frozen-lockfile failed.
          This workflow does not update pnpm-lock.yaml.
          If this commit changes dependencies or the expo-router patch, update the
          lockfile on a push-fe branch with pnpm 11.0.4 at the push-fe root and
          rerun this workflow with the push-fe-ref input set to that branch or SHA.
          The default ref is develop.
          HINT

      - name: Build
        env:
          VITE_API_BASE_URL: https://push-be.youngjoon568.workers.dev/api/v1
        run: |
          set -euo pipefail
          # Production bundles must not include the mock client.
          unset VITE_PUSH_MOCK || true
          pnpm --filter @push/fo-web build
          test -f apps/fo-web/dist/index.html

      - name: Check deploy secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$CLOUDFLARE_API_TOKEN" = true ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ "$CLOUDFLARE_ACCOUNT_ID" = true ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Deploy configuration missing::Set these GitHub Actions secrets: ${missing[*]}"
            exit 1
          fi

      - name: Deploy
        working-directory: apps/fo-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 deploy
