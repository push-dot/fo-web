<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Push</title>
    <!-- Noto Sans KR is bundled by main.tsx (@fontsource-variable/noto-sans-kr), so no page waits for a font CDN. -->
    <script>
      ;(function () {
        var params = new URLSearchParams(location.search)
        var theme = params.get('theme')
        if (theme !== 'light' && theme !== 'dark' && !window.ReactNativeWebView) {
          try {
            theme = localStorage.getItem('push-theme')
          } catch (error) {}
        }
        if (!document.documentElement.hasAttribute('data-theme') && (theme === 'light' || theme === 'dark')) {
          document.documentElement.dataset.theme = theme
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
